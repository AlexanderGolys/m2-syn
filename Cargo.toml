[workspace]
resolver = "3"
members = ["m2-syn-macros"]

[package]
name = "m2-syn"
version = "0.7.0"
edition = "2024"
description = "Parser, typed CST, traversal and procedural macros for Macaulay2"
license = "MIT"
repository = "https://github.com/AlexanderGolys/m2-syn"
readme = "README.md"
keywords = ["macaulay2", "syntax", "syn", "parse", "m2"]
categories = ["development-tools::ffi", "parser-implementations"]
exclude = [
    "book/",
    "codex-session-*.md",
    "examples/example_sequences.m2",
    "src/schema/nodes_rules.rs",
]

[features]
default = ["tree-sitter"]
tree-sitter = ["dep:tree-sitter", "dep:tree-sitter-macaulay2"]

[dependencies]
m2-syn-macros = { version = "0.6.0", path = "m2-syn-macros" }
tree-sitter = { version = "0.26.12", optional = true }
tree-sitter-macaulay2 = { version = "6.3.2", optional = true }
these-macros-should-be-illegal = { version = "0.7.0" }

[[example]]
name = "hierarchy_visit_emit"
required-features = ["tree-sitter"]

[[example]]
name = "inspect"
required-features = ["tree-sitter"]

[[example]]
name = "type_inference"
required-features = ["tree-sitter"]

[[test]]
name = "generated_api"
required-features = ["tree-sitter"]

[[test]]
name = "expression_specializations"
required-features = ["tree-sitter"]

[[test]]
name = "parsed_file"
required-features = ["tree-sitter"]

[[test]]
name = "parser_api"
required-features = ["tree-sitter"]

[[test]]
name = "realtime_parser"
required-features = ["tree-sitter"]

[[test]]
name = "review_regressions"
required-features = ["tree-sitter"]

[[test]]
name = "cell_separation"
required-features = ["tree-sitter"]

[[test]]
name = "comment_after_closer"
required-features = ["tree-sitter"]

[[test]]
name = "comment_placement"
required-features = ["tree-sitter"]

[[test]]
name = "leading_layout"
required-features = ["tree-sitter"]

[[test]]
name = "left_arrow_assignment_target"
required-features = ["tree-sitter"]

[[test]]
name = "trailing_layout"
required-features = ["tree-sitter"]

[[test]]
name = "tree_sitter_reconstruction"
required-features = ["tree-sitter"]

[lints.rust]
missing_docs = "deny"
